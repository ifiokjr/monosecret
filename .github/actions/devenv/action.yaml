name: devenv
description: Set up the Monosecret development environment with devenv
inputs:
  github-token:
    description: GitHub token used by Nix and GitHub API backed tools.
    required: true
  cache-version:
    description: Version prefix for caches.
    required: false
    default: v1
  free-runner-space:
    description: Free Ubuntu runner disk space before installing dependencies.
    required: false
    default: "false"
  install-node:
    description: Install pnpm workspace dependencies when package.json is present.
    required: false
    default: "true"
  install-dart:
    description: Run dart pub get for the Dart workspace.
    required: false
    default: "true"
  activate:
    description: Export the devenv environment to later non-devenv shell steps.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: free ubuntu runner space
      if: runner.os == 'Linux' && inputs.free-runner-space == 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/local/lib/android /usr/share/dotnet
        docker system prune --all --force || true
        sudo apt-get clean
        echo "Disk space after cleanup:"
        df -h

    - name: install linux system dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y libdbus-1-dev pkg-config

    - name: cache rust dependencies
      id: cache-rust-dependencies
      continue-on-error: true
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        prefix-key: ${{ inputs.cache-version }}
        cache-targets: false

    - name: cache cargo binaries
      id: cache-cargo-binaries
      continue-on-error: true
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ./.bin
        key: ${{ runner.os }}-cargo-bin-${{ inputs.cache-version }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'rust-toolchain.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-bin-${{ inputs.cache-version }}-

    - name: install nix
      id: install-nix
      continue-on-error: true
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: retry install nix
      if: steps.install-nix.outcome != 'success'
      uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ inputs.github-token }}

    - name: set up devenv
      shell: bash
      run: |
        set -euo pipefail
        # Pin the installer inputs to a fixed nixpkgs-unstable snapshot
        # (0af3d1402dec3fc7e93635e511d1f7428c89cebf, devenv 2.2.2 / cachix
        # 1.9.1+) — the same toolchain the floating nixpkgs# channel served
        # CI on 2026-09-07. The channel is a moving target: when an unstable
        # snapshot ships an invalid stdenv bootstrap path
        # ("unpack-bootstrap-tools.sh" / "builder.sh" is not valid), every
        # fresh evaluation fails until the channel self-heals, which
        # repeatedly broke lint/build/packaging jobs. Deliberately NOT the
        # devenv.lock revision: it is older and ships devenv 1.11.1, whose
        # shell sets TMPDIR from XDG_RUNTIME_DIR and breaks the snapshot
        # tests (PR #52's first run).
        nixpkgs_rev="0af3d1402dec3fc7e93635e511d1f7428c89cebf"
        for attempt in 1 2 3; do
          if nix profile add --accept-flake-config "github:NixOS/nixpkgs/${nixpkgs_rev}#cachix" && cachix use devenv && nix profile add "github:NixOS/nixpkgs/${nixpkgs_rev}#devenv"; then
            exit 0
          fi
          if [ "$attempt" -eq 3 ]; then
            echo "::error::Failed to set up devenv after ${attempt} attempts"
            exit 1
          fi
          sleep $((attempt * 10))
        done

    - name: warm devenv shell
      shell: bash
      run: devenv shell -- echo "devenv ready"

    - name: install rustup nightly components
      shell: bash
      run: |
        set -euo pipefail
        devenv shell -- rustup toolchain install nightly --profile default \
          --component cargo \
          --component clippy \
          --component llvm-tools-preview \
          --component rustfmt \
          --component rust-src

    - name: activate devenv environment
      if: inputs.activate == 'true'
      shell: bash
      run: |
        set -euo pipefail
        devenv shell -- env | while IFS= read -r line; do
          [[ "$line" =~ ^PATH= ]] && continue
          [[ -z "$line" ]] && continue
          echo "$line" >> "$GITHUB_ENV"
        done
        devenv shell -- printenv PATH | tr ':' '\n' | while read -r dir; do
          [[ -d "$dir" ]] && echo "$dir" >> "$GITHUB_PATH"
        done

    - name: install pnpm dependencies
      if: inputs.install-node == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -f package.json ]; then
          exit 0
        fi
        if [ -f pnpm-lock.yaml ]; then
          devenv shell -- pnpm install --frozen-lockfile
        else
          devenv shell -- pnpm install --no-frozen-lockfile
        fi

    - name: install dart dependencies
      if: inputs.install-dart == 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ -f pubspec.yaml ]; then
          devenv shell -- dart pub get
        fi
