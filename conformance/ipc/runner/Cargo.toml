[package]
name = "monosecret_rpc-conformance"
version.workspace = true
edition.workspace = true
description = "Cross-language IPC conformance runner"
publish = false
default-run = "monosecret_rpc-conformance"

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
monosecret = { path = "../../../crates/monosecret", default-features = false }
monosecret_rpc = { workspace = true, features = ["blocking"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
proptest.workspace = true

[build-dependencies]
cc = "1"
pkg-config = "0.3"
