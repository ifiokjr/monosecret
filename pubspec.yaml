name: monosecret_workspace
publish_to: none

environment:
  sdk: ^3.10.0

hooks:
  user_defines:
    monosecret:
      native_library_directory: target/debug

workspace:
  - dart/monosecret
  - dart/monosecret_builder

dev_dependencies:
  coverage: ^1.9.0
  melos: ^8.7.0
  test: ">=1.25.0 <1.32.0" # test 1.32+ requires SDK 3.11; CI pins Dart 3.10.9
