[package]
name = "monosecret"
version = "0.4.4"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/ifiokjr/monosecret/tree/main/crates/monosecret"
description = "Declarative secrets, every environment, any provider"
default-run = "monosecret"

[lints]
workspace = true

[lib]
name = "monosecret"
path = "src/lib.rs"

[[bin]]
name = "monosecret"
path = "src/bin/monosecret.rs"
required-features = ["cli"]

[[bin]]
name = "docker-credential-monosecret"
path = "src/bin/docker-credential-monosecret.rs"
required-features = ["cli"]

[[bin]]
name = "git-credential-monosecret"
path = "src/bin/git-credential-monosecret.rs"
required-features = ["cli"]

[dependencies]
age = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true, default-features = true }
aws-lc-rs = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true, default-features = true }
aws-sdk-ssm = { workspace = true, optional = true, default-features = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_security_keyvault_secrets = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bech32 = { workspace = true, optional = true }
bip39 = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
clap_complete = { workspace = true, optional = true }
clap_complete_nushell = { workspace = true, optional = true }
colored = { workspace = true, optional = true }
data-encoding = { workspace = true, optional = true }
detect-coding-agent = { workspace = true, optional = true }
dotenv = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
etcetera = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
google-cloud-secretmanager-v1 = { workspace = true, optional = true }
http = { workspace = true, optional = true }
ini = { workspace = true, optional = true }
inquire = { workspace = true, optional = true }
is_executable = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
json-patch = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
keepass = { workspace = true, optional = true }
keeper-secrets-manager-core = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
linkme = { workspace = true, optional = true }
miette = { workspace = true, optional = true }
monosecret_rpc = { workspace = true, optional = true }
p12-keystore = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
pem = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
pgp = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rand_08 = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rsa = { workspace = true, optional = true }
same-file = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
secrecy = { version = "0.10.3", default-features = false, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_norway = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
ssh-key = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { optional = true, workspace = true, features = [
  "io-std",
  "io-util",
  "macros",
  "process",
  "sync",
  "time",
] }
toml = { workspace = true, optional = true }
toml_edit = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
wait-timeout = { workspace = true, optional = true }
whoami = { workspace = true, optional = true }
x25519-dalek = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
signal-hook = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
# `windows_security` is unconditional on Windows: it backs the ACL checks the
# credential broker and the temp-file lease rely on, independent of which
# providers are compiled in.
windows-sys = { optional = true, workspace = true }

[features]
ejson = ["runtime", "dep:wait-timeout"]
client = ["dep:secrecy"]
# Native resolution and providers. Omit this feature in Wasm clients.
runtime = [
  "secrecy/serde",
  "dep:async-trait",
  "dep:aws-lc-rs",
  "dep:bech32",
  "dep:bip39",
  "dep:clap",
  "dep:colored",
  "dep:data-encoding",
  "dep:detect-coding-agent",
  "dep:dotenv",
  "dep:ed25519-dalek",
  "dep:etcetera",
  "dep:ini",
  "dep:inquire",
  "dep:jiff",
  "dep:linkme",
  "dep:miette",
  "dep:monosecret_rpc",
  "dep:p12-keystore",
  "dep:p256",
  "dep:pem",
  "dep:percent-encoding",
  "dep:pgp",
  "dep:rand",
  "dep:rand_08",
  "dep:rcgen",
  "dep:rsa",
  "dep:same-file",
  "dep:schemars",
  "dep:secrecy",
  "dep:serde",
  "dep:serde_json",
  "dep:sha2",
  "dep:smallvec",
  "dep:ssh-key",
  "dep:tempfile",
  "dep:thiserror",
  "dep:time",
  "dep:tokio",
  "dep:toml",
  "dep:toml_edit",
  "dep:tracing",
  "dep:url",
  "dep:uuid",
  "dep:x25519-dalek",
  "dep:x509-parser",
  "dep:libc",
  "dep:signal-hook",
  "dep:windows-sys",
]
default = [
  "runtime",
  "cli",
  "keyring",
  "kdbx",
  "keeper",
  "gcsm",
  "awssm",
  "awsps",
  "vault",
  "openbao",
  "bws",
  "akv",
  "aac",
  "infisical",
  "doppler",
  "bw",
  "age",
  "ejson",
  "scaleway",
  "sops",
  "kubernetes",
  "cloudflare",
  "netlify",
  "vercel",
  "digitalocean",
  "convex",
  "railway",
  "pulumi",
  "setec",
]
cli = [
  "runtime",
  "dep:clap_complete",
  "dep:clap_complete_nushell",
  "dep:is_executable",
  "dep:dunce",
]
keyring = ["runtime", "dep:keyring", "dep:whoami", "dep:security-framework"]
kdbx = ["runtime", "dep:keepass"]
keeper = ["runtime", "dep:keeper-secrets-manager-core"]
gcsm = [
  "runtime",
  "dep:google-cloud-secretmanager-v1",
  "dep:google-cloud-gax",
  "dep:http",
]
awssm = [
  "runtime",
  "dep:aws-config",
  "dep:aws-sdk-secretsmanager",
  "aws-config/credentials-login",
]
awsps = ["runtime", "dep:aws-config", "dep:aws-sdk-ssm"]
vault = ["runtime", "dep:reqwest", "dep:http", "tokio/sync"]
scaleway = ["runtime", "dep:reqwest", "dep:http"]
# Cloudflare Secrets Store talks to the v1 REST API directly; reqwest is
# already on transitively via other providers, but a provider should name the
# features it uses rather than inherit them from a sibling.
cloudflare = ["runtime", "dep:reqwest", "dep:http"]
# Netlify and Vercel talk to their REST APIs directly; like `cloudflare`, each
# names reqwest rather than inheriting it from a sibling.
netlify = ["runtime", "dep:reqwest", "dep:http"]
vercel = ["runtime", "dep:reqwest", "dep:http"]
# DigitalOcean Secrets Manager and the Convex deployment API likewise call a
# REST API directly and name reqwest themselves.
digitalocean = ["runtime", "dep:reqwest", "dep:http"]
convex = ["runtime", "dep:reqwest", "dep:http"]
# Railway talks to its GraphQL API and Pulumi to the ESC REST API; both name
# reqwest directly, and Pulumi's ESC definitions are YAML so it names
# serde_norway as well. Every reqwest feature also names http: the shared
# response buffering in provider/http.rs builds an ::http::Response.
railway = ["runtime", "dep:reqwest", "dep:http"]
pulumi = ["runtime", "dep:reqwest", "dep:http", "dep:serde_norway"]
openbao = ["runtime", "dep:reqwest", "dep:http", "tokio/sync"]
infisical = ["runtime", "dep:reqwest", "dep:http", "tokio/sync"]
doppler = ["runtime", "dep:reqwest", "dep:http"]
setec = ["runtime", "dep:reqwest", "dep:http"]
bws = ["runtime"]
bw = ["runtime", "dep:base64"]
akv = [
  "runtime",
  "dep:azure_core",
  "dep:azure_identity",
  "dep:azure_security_keyvault_secrets",
]
# App Configuration connection strings use Azure Core's existing HMAC-SHA256
# implementation, avoiding a second cryptography dependency.
aac = ["runtime", "akv", "dep:reqwest", "dep:http", "azure_core/hmac_rust"]
age = ["runtime", "dep:age"]
sops = ["runtime"]
kubernetes = [
  "runtime",
  "dep:kube",
  "dep:k8s-openapi",
  "dep:base64",
  "dep:json-patch",
]

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
insta.workspace = true
insta-cmd.workspace = true
jsonschema = { version = "0.55.1", default-features = false }
# The IPC integration tests drive a blocking resolver session, which the crate
# only compiles under its `blocking` feature.
monosecret_rpc = { workspace = true, features = ["blocking"] }
proptest.workspace = true

[[example]]
name = "wasm_client"
crate-type = ["cdylib"]
required-features = ["client"]
