[package]
name = "monosecret"
version = "0.3.4"
edition.workspace = true
license = "Apache-2.0"
repository = "https://github.com/ifiokjr/monosecret/tree/main/crates/monosecret"
description = "Declarative secrets, every environment, any provider"
default-run = "monosecret"

[lints]
workspace = true

[lib]
name = "monosecret"
path = "src/lib.rs"

[[bin]]
name = "monosecret"
path = "src/bin/monosecret.rs"
required-features = ["cli"]

[[bin]]
name = "docker-credential-monosecret"
path = "src/bin/docker-credential-monosecret.rs"
required-features = ["cli"]

[[bin]]
name = "git-credential-monosecret"
path = "src/bin/git-credential-monosecret.rs"
required-features = ["cli"]

[dependencies]
age = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true, default-features = true }
aws-sdk-secretsmanager = { workspace = true, optional = true, default-features = true }
aws-sdk-ssm = { workspace = true, optional = true, default-features = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_security_keyvault_secrets = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
clap.workspace = true
clap_complete = { workspace = true, optional = true }
clap_complete_nushell = { workspace = true, optional = true }
colored.workspace = true
data-encoding.workspace = true
detect-coding-agent.workspace = true
dotenv.workspace = true
dunce = { workspace = true, optional = true }
etcetera.workspace = true
google-cloud-secretmanager-v1 = { workspace = true, optional = true }
ini.workspace = true
inquire.workspace = true
is_executable = { workspace = true, optional = true }
jiff.workspace = true
json-patch = { workspace = true, optional = true }
k8s-openapi = { workspace = true, optional = true }
keepass = { workspace = true, optional = true }
keeper-secrets-manager-core = { workspace = true, optional = true }
keyring = { workspace = true, optional = true }
kube = { workspace = true, optional = true }
linkme.workspace = true
miette.workspace = true
percent-encoding.workspace = true
rand.workspace = true
reqwest = { workspace = true, optional = true }
rsa.workspace = true
same-file.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
whoami = { workspace = true, optional = true }
wait-timeout = { workspace = true, optional = true }
rand_08.workspace = true
pgp.workspace = true
smallvec.workspace = true
ssh-key.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
signal-hook.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, optional = true }

[features]
ejson = ["dep:wait-timeout", "dep:windows-sys"]
default = [
  "cli",
  "keyring",
  "kdbx",
  "keeper",
  "gcsm",
  "awssm",
  "awsps",
  "vault",
  "openbao",
  "bws",
  "akv",
  "aac",
  "infisical",
  "bw",
  "age",
  "ejson",
  "scaleway",
  "sops",
  "kubernetes",
  "cloudflare",
]
cli = [
  "dep:clap_complete",
  "dep:clap_complete_nushell",
  "dep:is_executable",
  "dep:dunce",
]
keyring = ["dep:keyring", "dep:whoami"]
kdbx = ["dep:keepass"]
keeper = ["dep:keeper-secrets-manager-core"]
gcsm = ["dep:google-cloud-secretmanager-v1"]
awssm = [
  "dep:aws-config",
  "dep:aws-sdk-secretsmanager",
  "aws-config/credentials-login",
]
awsps = ["dep:aws-config", "dep:aws-sdk-ssm"]
vault = ["dep:reqwest", "tokio/sync"]
scaleway = ["dep:reqwest"]
# Cloudflare Secrets Store talks to the v1 REST API directly; reqwest is
# already on transitively via other providers, but a provider should name the
# features it uses rather than inherit them from a sibling.
cloudflare = ["dep:reqwest"]
openbao = ["dep:reqwest", "tokio/sync"]
infisical = ["dep:reqwest", "tokio/sync"]
bws = []
bw = ["dep:base64"]
akv = [
  "dep:azure_core",
  "dep:azure_identity",
  "dep:azure_security_keyvault_secrets",
]
# App Configuration connection strings use Azure Core's existing HMAC-SHA256
# implementation, avoiding a second cryptography dependency.
aac = ["akv", "dep:reqwest", "azure_core/hmac_rust"]
age = ["dep:age"]
sops = []
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:base64", "dep:json-patch"]

[dev-dependencies]
insta.workspace = true
insta-cmd.workspace = true
jsonschema = { version = "0.55.1", default-features = false }
proptest.workspace = true
